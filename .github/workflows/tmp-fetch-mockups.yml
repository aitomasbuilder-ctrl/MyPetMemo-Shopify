name: tmp fetch ornament mockups
on:
  push:
    branches: [claude/tmp-fetch-mockups]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p mockups
          while read name url; do
            curl -sSfL "$url&width=600" -o "mockups/$name.jpg" || echo "fail $name"
          done < mockup-list.txt
          git config user.name "claude"; git config user.email "noreply@anthropic.com"
          git add mockups && git commit -m "mockup thumbnails" && git push
